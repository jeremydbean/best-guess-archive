name: Auto-merge Claude session branches to main

on:
  push:
    branches:
      - 'claude/**'

jobs:
  merge:
    runs-on: ubuntu-latest
    concurrency:
      group: merge-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff origin/${{ github.ref_name }} -m "Auto-merge ${{ github.ref_name }} into main"
          git push origin main
          # Branch cleanup is best-effort. When two commits are pushed in quick
          # succession, both runs merge fine but the second finds the branch
          # already deleted by the first. That must not fail the run — the merge
          # has already succeeded by this point.
          git push origin --delete ${{ github.ref_name }} || \
            echo "Branch ${{ github.ref_name }} already deleted; nothing to clean up."
