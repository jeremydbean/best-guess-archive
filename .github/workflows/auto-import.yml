name: Auto-import Best Guess Live episode

on:
  schedule:
    - cron: "45 1 * * 2-6"  # 9:45pm EDT (Mar–Nov) — Tue–Sat in UTC
    - cron: "45 2 * * 2-6"  # 9:45pm EST (Nov–Mar) — second trigger is a no-op if already imported
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID (leave blank to auto-detect from RSS)"
        required: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install youtube-transcript-api anthropic

      - name: Run auto-import
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.video_id }}" ]; then
            python scripts/auto-import.py --video-id="${{ github.event.inputs.video_id }}"
          else
            python scripts/auto-import.py
          fi

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new episode data."
          else
            git commit -m "Auto-import episode $(date -u +%Y-%m-%d) [skip ci]"
            git push origin main
          fi
