name: Auto-import Best Guess Live episode

on:
  schedule:
    - cron: "45 1 * * 2-6"  # 9:45pm EDT (Mar–Nov) — Tue–Sat in UTC
    - cron: "45 2 * * 2-6"  # 9:45pm EST (Nov–Mar) — second trigger is a no-op if already imported
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID (leave blank to auto-detect from RSS)"
        required: false

jobs:
  import:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python deps
        run: py -m pip install youtube-transcript-api anthropic

      - name: Run auto-import
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          $videoId = "${{ github.event.inputs.video_id }}"
          if ($videoId -ne "") {
            py scripts/auto-import.py --video-id="$videoId"
          } else {
            py scripts/auto-import.py
          }

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
            git commit -m "Auto-import episode $date [skip ci]"
            git push origin main
          } else {
            Write-Host "Nothing to commit — no new episode data."
          }
