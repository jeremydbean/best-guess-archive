name: Auto-import Best Guess Live episode

on:
  schedule:
    - cron: "5 13 * * 2-6"  # 9:05am EDT (Mar-Nov) - import the previous weekday episode
    - cron: "5 14 * * 2-6"  # 9:05am EST (Nov-Mar) - second trigger is a no-op if already imported
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID (leave blank to auto-detect from RSS)"
        required: false

jobs:
  import:
    runs-on: self-hosted
    concurrency:
      group: auto-import-best-guess-live
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Skip duplicate DST schedule
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          $utcNow = (Get-Date).ToUniversalTime()
          try {
            $easternTz = [TimeZoneInfo]::FindSystemTimeZoneById("Eastern Standard Time")
          } catch {
            $easternTz = [TimeZoneInfo]::FindSystemTimeZoneById("America/New_York")
          }
          $easternNow = [TimeZoneInfo]::ConvertTimeFromUtc($utcNow, $easternTz)
          if ($easternNow.Hour -ne 9) {
            Write-Host "Skipping duplicate DST schedule. Local Eastern time is $($easternNow.ToString('yyyy-MM-dd HH:mm'))."
            "AUTO_IMPORT_SKIP=true" >> $env:GITHUB_ENV
            exit 0
          }

      - name: Preflight main push access
        if: env.AUTO_IMPORT_SKIP != 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git push --dry-run origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Cannot push to origin/main. Stopping before any Claude API call."
            exit 1
          }

      - name: Install Python deps
        if: env.AUTO_IMPORT_SKIP != 'true'
        run: py -m pip install youtube-transcript-api anthropic tzdata

      - name: Run auto-import
        if: env.AUTO_IMPORT_SKIP != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.BGL_SCHEDULER_CLAUDE }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          $videoId = "${{ github.event.inputs.video_id }}"
          if ($videoId -ne "") {
            py scripts/auto-import.py --video-id="$videoId"
          } else {
            py scripts/auto-import.py --max-episodes=1
          }

      - name: Commit and push if data changed
        if: env.AUTO_IMPORT_SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $changes = git status --porcelain data/
          if (-not $changes) {
            Write-Host "Nothing to commit — no new episode data."
            exit 0
          }
          git stash push -m "auto-import data" -- data/
          git pull --rebase origin main
          git stash pop
          npm run audit:fix
          npm run audit
          git add data/
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
            git commit -m "Auto-import episode $date [skip ci]"
            git push origin main
          } else {
            Write-Host "Nothing to commit — no new episode data."
          }
